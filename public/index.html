<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idégeneratorn</title>
  <meta name="description" content="Idégeneratorn: frö, förgrena, korsa, bedöm, och låt evolutionen avla fram de bästa idéerna.">
  <meta property="og:title" content="Idégeneratorn">
  <meta property="og:description" content="Idégeneratorn: frö, förgrena, korsa, bedöm, och låt evolutionen avla fram de bästa idéerna.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='22' cy='38' r='14' fill='%233987e5'/><circle cx='42' cy='24' r='12' fill='%239085e9'/><circle cx='46' cy='46' r='8' fill='%23f5c542'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <div class="bar-left">
      <span class="brand" data-i18n="appName">Idégeneratorn</span>
      <div class="menu-wrap">
        <button id="board-menu-btn" class="btn ghost" aria-haspopup="true"></button>
        <div id="board-menu" class="menu" hidden></div>
      </div>
      <input id="board-title" class="title-input" data-i18n-title="title" spellcheck="false">
      <input id="board-goal" class="goal-input" data-i18n-title="goal">
      <span id="board-origin"></span>
    </div>
    <div class="bar-right">
      <div id="view-mode-group" class="view-mode-group" role="group" aria-label="View Mode">
        <button id="view-organic-btn" class="view-btn active" title="Organic Freeform Canvas" data-mode="organic">🌐 Organic</button>
        <button id="view-tree-btn" class="view-btn" title="Hierarchical Lineage Tree" data-mode="tree">🌳 Tree</button>
        <button id="view-matrix-btn" class="view-btn" title="2x2 Impact vs Feasibility Matrix" data-mode="matrix">📊 2x2 Matrix</button>
      </div>
      <button id="mode-toggle" class="mode" aria-pressed="false"></button>
      <span id="ap-status" class="ap-chip" aria-live="polite"></span>
      <button id="leads-btn" class="btn ghost" aria-expanded="false" data-i18n="leads"></button>
      <button id="dashboard-btn" class="btn ghost" data-i18n="dashboard"></button>
      <button id="report-btn" class="btn ghost" data-i18n="report"></button>
      <button id="exhibit-btn" class="btn ghost" data-i18n="exhibit"></button>
      <button id="export-btn" class="btn ghost" data-i18n="export"></button>
      <button id="board-settings-btn" class="icon-btn" data-i18n-title="boardSettings">⚙</button>
      <button id="app-settings-btn" class="icon-btn" data-i18n-title="appSettings">🔑</button>
    </div>
  </header>

  <main>
    <aside id="leads-panel" hidden></aside>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="canvas-actions" class="canvas-actions" hidden>
        <button id="ca-expand" class="ca-btn" title="Expand node (Tab)">⚡ Expand</button>
        <button id="ca-breed" class="ca-btn" title="Breed / Combine with another node">🔗 Breed</button>
        <button id="ca-critique" class="ca-btn" title="Devil's Advocate Stress-Test">⚖️ Critique</button>
        <button id="ca-gold" class="ca-btn" title="Toggle Gold Bookmark (G)">⭐ Gold</button>
        <button id="ca-close" class="ca-close" title="Close action bar">✕</button>
      </div>
      <div id="zoom">
        <button id="zoom-in" class="icon-btn" aria-label="+">＋</button>
        <button id="zoom-out" class="icon-btn" aria-label="−">－</button>
        <button id="fit-btn" class="icon-btn" data-i18n-title="fit">⤢</button>
      </div>
      <form id="seedbar" autocomplete="off">
        <textarea id="seed-input" rows="1" data-i18n-ph="seedPlaceholder" aria-label="Seed" placeholder="Type a seed idea, question, or paste a link..."></textarea>
      </form>
      <div id="exhibit-overlay" aria-hidden="true">
        <h1 id="ex-title"></h1>
        <p id="ex-goal"></p>
        <p id="ex-status"></p>
        <ol id="ex-top"></ol>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>

  <section id="dashboard" hidden tabindex="-1"></section>
  <section id="report" class="overlay-view" hidden tabindex="-1"></section>
  <dialog id="dlg"></dialog>
  <dialog id="cmd-palette" class="cmd-palette">
    <div class="cmd-box">
      <div class="cmd-input-wrap">
        <span class="cmd-icon">⌘</span>
        <input id="cmd-input" placeholder="Type a command or search action (e.g. /tree, /matrix, /critique, /pitch)..." autocomplete="off" spellcheck="false">
        <span class="cmd-esc">ESC</span>
      </div>
      <div id="cmd-results" class="cmd-results"></div>
      <div class="cmd-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </dialog>
  <div id="hovercard" role="tooltip"></div>
  <div id="viz-tip" role="tooltip"></div>
  <div id="toasts" aria-live="polite"></div>
  <datalist id="model-list"></datalist>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
